name: Publish

# Publishing runs on a GitHub release. PyPI uses Trusted Publishing (OIDC), so no API
# token is stored anywhere: PyPI is configured to trust this repository and workflow.
# The MCP registry step authenticates with the same GitHub OIDC identity.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  pypi:
    needs: test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write # GitHub OIDC identity for the registry
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/
      - name: Wait for the release to appear on PyPI
        run: sleep 60
      - run: mcp-publisher login github-oidc
      - run: mcp-publisher publish
