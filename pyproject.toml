[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mybox-mcp"
version = "0.1.0"
description = "MCP server for the NAVER MYBOX Open API - list, search, download and upload files"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "java-jaydev" }]
keywords = ["mcp", "model-context-protocol", "naver", "mybox", "cloud-storage"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: File Transfer Protocol (FTP)",
]
dependencies = [
    "mcp>=2.0,<3.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
mybox-mcp = "mybox_mcp.server:main"

[project.urls]
Homepage = "https://github.com/java-jaydev/mybox-mcp"
Issues = "https://github.com/java-jaydev/mybox-mcp/issues"
"MYBOX Open API" = "https://developers.mybox.naver.com/"

[tool.hatch.build.targets.wheel]
packages = ["src/mybox_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
